spring.application.name=graphqldemo
server.port=8081

graphql.packages=com.example.graphqldemo

# graphql.batching.enabled=true (SYNC_EXHAUSTION) ar INTE pakopplat med flit.
# Den kallar doNotAutomaticallyDispatchDataLoader() och later
# DataLoaderSyncExecutionExhaustedInstrumentation sta for dispatchen. Det fungerar for
# queries, men en DataLoader inuti en mutation (AsyncSerialExecutionStrategy) dispatchas
# aldrig och requesten hanger. graphql-javas automatiska dispatch batchar bra utan den.

# Satt DEBUG for att se DataLoader-batcharna i loggen
logging.level.com.example.graphqldemo.app.api=INFO
